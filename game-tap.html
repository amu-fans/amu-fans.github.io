<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動員ゲーム | 【非公式】勝手に聖奈あむ応援ファンサイト</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>

:root{--main-pink:#ff2a7a;--text-black:#111111;--bg-white:#ffffff;--pk:#ff2a7a;--pk2:#ff9cc2;--k:#0c070c;--k2:#170d17;--k3:#261526;--wh:#fff6fa;--mu:#bba6b4;--ln:#4a2540;--lv:#c9a7ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
.no-scroll{overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;z-index:1100;background:var(--k);border-bottom:3px solid var(--pk)}
.header:after{content:"";position:absolute;left:0;right:0;top:100%;height:9px;pointer-events:none;background:linear-gradient(135deg,var(--pk) 25%,transparent 25%) -9px 0,linear-gradient(225deg,var(--pk) 25%,transparent 25%) -9px 0;background-size:18px 9px}
.site-logo{position:relative;padding-left:14px;font-size:13px;font-weight:900;letter-spacing:.06em;color:#fff;text-decoration:none;line-height:1.35;max-width:calc(100% - 60px);z-index:1001}
.site-logo:before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:5px;background:var(--pk);transform:skewX(-14deg)}
.hamburger{width:30px;height:20px;position:relative;cursor:pointer;z-index:1001}
.hamburger span{position:absolute;left:0;width:100%;height:3px;background:#fff;transition:all .3s ease}
.hamburger span:nth-child(1){top:0}.hamburger span:nth-child(2){top:50%;transform:translateY(-50%);width:70%;background:var(--pk)}.hamburger span:nth-child(3){bottom:0}
.hamburger.active span:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){bottom:50%;transform:translateY(50%) rotate(-45deg)}
.global-nav{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;background:var(--k);z-index:1000;display:flex;flex-direction:column;align-items:center;padding-top:110px;overflow:hidden;transform:translateX(100%);transition:transform .45s cubic-bezier(.77,0,.18,1)}
.global-nav:before{content:"";position:absolute;right:-25%;top:0;width:75%;height:100%;background:var(--pk);opacity:.14;transform:skewX(-14deg)}
.global-nav.active{transform:translateX(0)}
.nav-list{list-style:none;text-align:center;position:relative}
.nav-list li{margin:20px 0;opacity:0;transform:translateY(20px);transition:opacity .3s,transform .3s}
.global-nav.active .nav-list li{opacity:1;transform:none}
.global-nav.active .nav-list li:nth-child(1){transition-delay:.25s}.global-nav.active .nav-list li:nth-child(2){transition-delay:.33s}.global-nav.active .nav-list li:nth-child(3){transition-delay:.41s}.global-nav.active .nav-list li:nth-child(4){transition-delay:.49s}
.nav-list a{display:block;color:#fff;text-decoration:none;font-size:34px;font-weight:900;letter-spacing:2px;transform:skewX(-8deg)}
.nav-list a:hover{color:var(--pk)}
.nav-list span{display:block;font-size:12px;font-weight:700;letter-spacing:.2em;margin-top:2px;color:var(--pk)}
.nav-note{position:absolute;bottom:0;left:0;width:100%;padding:20px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:11px;line-height:1.7;color:var(--mu)}
.site-footer{position:relative;width:100%;background:var(--k);color:var(--mu);text-align:center;font-size:11px;line-height:1.8;padding:44px 20px calc(36px + env(safe-area-inset-bottom));border-top:3px solid var(--pk)}
.site-footer p+p{margin-top:8px}.site-footer .copy{font-size:10px;margin-top:14px;color:var(--pk2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,2,8,.8);z-index:2000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-content{position:relative;width:100%;max-width:400px;padding:28px 22px;background:var(--k2);color:var(--wh);border:2px solid var(--pk);box-shadow:8px 8px 0 var(--pk);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.modal-close-btn{position:absolute;top:8px;right:22px;font-size:28px;color:var(--pk);background:none;border:none;cursor:pointer}
.modal-title{font-size:19px;font-weight:900;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--pk);text-align:center;color:#fff}
.modal-info-group{margin-bottom:12px}
.modal-label{display:block;font-size:11px;font-weight:900;color:var(--pk);margin-bottom:2px;letter-spacing:.08em}
.modal-text{font-size:14px;font-weight:700;color:var(--wh);line-height:1.5}
.modal-text a{color:var(--pk2);text-decoration:underline;word-break:break-all}
.header.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.6)}
@media(min-width:900px){
.header{height:72px;padding:0 max(28px,calc((100% - 1120px)/2))}
.site-logo{font-size:15px;max-width:none}
.hamburger,.nav-note,.global-nav:before{display:none}
.global-nav{left:auto;right:max(28px,calc((100% - 1120px)/2));width:auto;height:72px;padding:0;flex-direction:row;align-items:center;background:none;overflow:visible;transform:none;transition:none;z-index:1101}
.nav-list{display:flex;gap:34px}
.nav-list li{margin:0;opacity:1;transform:none}
.nav-list a{font-size:15px;letter-spacing:.14em;transform:skewX(-8deg)}
.nav-list span{font-size:10px;letter-spacing:.12em;margin-top:0}
.nav-list a:hover span{color:#fff}
}

body{background:var(--k);color:var(--wh);display:flex;flex-direction:column;min-height:100vh}
.game-main{flex:1;width:100%;max-width:560px;margin:0 auto;padding-top:80px}
.back-link{display:inline-block;margin:14px 16px;color:var(--pk2);font-size:13px;font-weight:900;text-decoration:none}
.back-link:hover{color:#fff}
/* ==================================================
     ヒーローエリア（聖奈あむくりっかー統合）
  ================================================== */
  .hero {
    width: 100%;
    margin-top: 60px; 
    position: relative;
    background-color: #111; 
    background-image: url('game/bg_a.jpg'); /* 最背面背景 */
    background-size: cover;
    background-position: center;
    overflow: hidden !important; 
    aspect-ratio: 5 / 7; /* game.htmlと同様の5:7に固定 */
    container-type: inline-size;  
  }

  .oshi-wrapper {
    position: absolute;
    left: 50%;
    top: 50%; 
    transform: translate(-50%, -50%);
    transform-origin: center center;
    z-index: 5; 
  }

  .oshi-shaker {
    display: flex;
    justify-content: center;
    align-items: center;
    transform-origin: center center;
  }

  /* タップのレスポンス向上とCanvas基盤の構築 */
  .oshi-button {
    position: relative;
    width: 45cqw;
    height: 45cqw;
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transform: translateZ(0) scale(1.5);
    transform-origin: center center;
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
  }

  #oshiCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; /* タップは親要素で判定 */
    /* マスキングの代わりにキャンバス自体にドロップシャドウをかけて発光を表現 */
    filter: drop-shadow(0 0 var(--shadow-blur, 0px) var(--aura-color, transparent));
    transition: filter 0.1s;
  }

  .oshi-button.resetting { 
    transition: transform 0.4s ease-out; 
  }

  /* ==================================================
     ゲーム前面レイヤー・テキストUI
  ================================================== */
  .foreground-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('game/bg_b.png'); /* 前景画像 */
    background-size: cover;
    background-position: center;
    pointer-events: none; 
    z-index: 8; 
  }

  .counter-area {
    margin-top: 8cqw; 
    text-align: center;
    z-index: 15; 
    width: 100%; 
    position: relative;
  }

  .total-clicks {
    font-size: 8cqw; 
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 
      -0.5cqw -0.5cqw 0 #000,  
       0.5cqw -0.5cqw 0 #000,
      -0.5cqw  0.5cqw 0 #000,
       0.5cqw  0.5cqw 0 #000,
       0 0 15px rgba(0, 0, 0, 0.9);
  }

  .status-area {
    position: relative;
    width: 100%;
    height: 8cqw;
    margin-top: 1cqw;
  }

  .venue-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    font-size: 3.5cqw;
    font-weight: 900;
    color: #ffd700; 
    transition: opacity 0.3s ease;
    white-space: nowrap; 
    text-shadow: 
      -0.3cqw -0.3cqw 0 #000,  
       0.3cqw -0.3cqw 0 #000,
      -0.3cqw  0.3cqw 0 #000,
       0.3cqw  0.3cqw 0 #000,
       0 0 8px rgba(0,0,0,0.8);
    opacity: 1;
  }
  .venue-text.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .combo-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    font-size: 5cqw; 
    font-weight: 900; 
    color: #44ff44;
    transition: color 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap; 
    text-shadow: 
      -0.4cqw -0.4cqw 0 #000,  
       0.4cqw -0.4cqw 0 #000,
      -0.4cqw  0.4cqw 0 #000,
       0.4cqw  0.4cqw 0 #000,
       0 0 10px rgba(0, 0, 0, 0.9);
  }

  .game-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10; 
  }

  .tap-guide {
    position: absolute;
    top: 95%; 
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8cqw;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 
      -0.5cqw -0.5cqw 0 var(--main-pink),  
       0.5cqw -0.5cqw 0 var(--main-pink),
      -0.5cqw  0.5cqw 0 var(--main-pink),
       0.5cqw  0.5cqw 0 var(--main-pink),
       0 0 10px rgba(0,0,0,0.8);
    pointer-events: none; 
    z-index: 20; 
    animation: pulse-tap 1.2s infinite; 
    transition: opacity 0.2s ease-out; 
  }

  /* コンボレベルごとのスタイル変更 */
  .hero.level-2 .combo-text { color: #ffaa00; }
  .hero.level-3 .oshi-shaker { animation: shake 0.2s infinite; }
  .hero.level-3 .combo-text {
    color: #ff0000;
    animation: combo-shake 0.1s infinite;
  }

  .floating-text {
    position: absolute;
    font-weight: 900; 
    color: #fff;
    text-shadow: 
      -0.3cqw -0.3cqw 0 #000,  
       0.3cqw -0.3cqw 0 #000,
      -0.3cqw  0.3cqw 0 #000,
       0.3cqw  0.3cqw 0 #000;
    pointer-events: none; 
    white-space: nowrap; 
    z-index: 20; 
    opacity: 1;
    animation: floatUp 1.0s ease-out forwards;
  }

  @keyframes floatUp {
    0% { transform: translate(-50%, -50%) rotate(var(--angle, 0deg)); opacity: 1; }
    50% { opacity: 1; }
    100% { transform: translate(-50%, calc(-50% - var(--travel-y, 25cqw))) rotate(var(--angle, 0deg)); opacity: 0; }
  }

  @keyframes shake {
    0% { transform: translate(0.2cqw, 0.2cqw) rotate(0deg); }
    10% { transform: translate(-0.2cqw, -0.4cqw) rotate(-1deg); }
    20% { transform: translate(-0.5cqw, 0px) rotate(1deg); }
    30% { transform: translate(0.5cqw, 0.4cqw) rotate(0deg); }
    40% { transform: translate(0.2cqw, -0.2cqw) rotate(1deg); }
    50% { transform: translate(-0.2cqw, 0.4cqw) rotate(-1deg); }
    60% { transform: translate(-0.5cqw, 0.2cqw) rotate(0deg); }
    70% { transform: translate(0.5cqw, 0.2cqw) rotate(-1deg); }
    80% { transform: translate(-0.2cqw, -0.2cqw) rotate(1deg); }
    90% { transform: translate(0.2cqw, 0.4cqw) rotate(0deg); }
    100% { transform: translate(0.2cqw, -0.4cqw) rotate(-1deg); }
  }

  @keyframes combo-shake {
    0% { transform: translate(calc(-50% + 0.2cqw), calc(-50% + 0.2cqw)) rotate(0deg); }
    10% { transform: translate(calc(-50% - 0.2cqw), calc(-50% - 0.4cqw)) rotate(-1deg); }
    20% { transform: translate(calc(-50% - 0.5cqw), calc(-50% + 0px)) rotate(1deg); }
    30% { transform: translate(calc(-50% + 0.5cqw), calc(-50% + 0.4cqw)) rotate(0deg); }
    40% { transform: translate(calc(-50% + 0.2cqw), calc(-50% - 0.2cqw)) rotate(1deg); }
    50% { transform: translate(calc(-50% - 0.2cqw), calc(-50% + 0.4cqw)) rotate(-1deg); }
    60% { transform: translate(calc(-50% - 0.5cqw), calc(-50% + 0.2cqw)) rotate(0deg); }
    70% { transform: translate(calc(-50% + 0.5cqw), calc(-50% + 0.2cqw)) rotate(-1deg); }
    80% { transform: translate(calc(-50% - 0.2cqw), calc(-50% - 0.2cqw)) rotate(1deg); }
    90% { transform: translate(calc(-50% + 0.2cqw), calc(-50% + 0.4cqw)) rotate(0deg); }
    100% { transform: translate(calc(-50% + 0.2cqw), calc(-50% - 0.4cqw)) rotate(-1deg); }
  }

  /* ==================================================
     赤いカウントダウンリボン
  ================================================== */
  .countdown-wrapper {
    position: absolute;
    bottom: 14.5%; 
    right: 6%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 50;
    padding: clamp(4px, 1cqw, 8px) clamp(10px, 2.2cqw, 18px); 
    background-color: #d10028;
    transform: rotate(-3deg); 
    border-radius: 4px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  .countdown-text {
    color: #ffffff;
    font-weight: 900;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: baseline;
    gap: 3px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
  }

  .countdown-prefix {
    font-size: clamp(12px, 2.4cqw, 18px); 
    letter-spacing: -0.5px;
  }

  .countdown-number {
    font-size: clamp(44px, 9.6cqw, 72px); 
    line-height: 0.85;
    font-family: 'Impact', 'Arial Black', sans-serif; 
    letter-spacing: -1.5px;
    padding: 0 2px;
  }

  .countdown-suffix {
    font-size: clamp(12px, 2.4cqw, 18px); 
    letter-spacing: -0.5px;
  }

  
.hero{margin-top:0 !important}

</style>
</head>
<body>
  <div id="common-header-container"></div>
  <main class="game-main">
    <a class="back-link" href="game.html">＜ ゲーム一覧</a>
    <!-- ヒーローエリア (ゲーム統合) -->
    <section id="hero" class="hero">
      
      <!-- ゲームUI情報 -->
      <div class="counter-area">
        <div class="total-clicks" id="totalCounter">動員: 0</div>
        <div class="status-area">
          <div class="venue-text" id="venueText"></div>
          <div class="combo-text" id="comboCounter"></div>
        </div>
      </div>

      <!-- キャラクタの配置とタップ領域 (Canvas描画でチラつきを完全排除) -->
      <div class="oshi-wrapper" id="oshiWrapper">
        <div class="oshi-shaker" id="oshiShaker">
          <div class="oshi-button" id="oshiBtn">
            <!-- Canvas要素 -->
            <canvas id="oshiCanvas"></canvas>
            <div class="tap-guide" id="tapGuide">TAP!</div>
          </div>
        </div>
      </div>

      <!-- 前景レイヤー（エフェクトやキャラ手前の装飾など） -->
      <div class="foreground-layer"></div>

      <!-- 飛び散る文字用のエリア -->
      <div class="game-area" id="gameArea"></div>
      
      <!-- 赤ラインとカウントダウン (ゲーム要素の上に重ねる) -->
      <div class="countdown-wrapper" id="crayonCountdown">
        <div class="countdown-text">
          <span class="countdown-prefix">あと</span>
          <span class="countdown-number" id="crayonDays">--</span>
          <span class="countdown-suffix">にち</span>
        </div>
      </div>
    </section>

    
  </main>
  <div id="footer-container"></div>
<script>
async function loadCommonHeader() {
      try {
        const response = await fetch('header.html');
        if (!response.ok) throw new Error('Header load failed');
        const html = await response.text();
        
        // 一旦見えない要素にHTMLを流し込む
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        // フッター（#sharedFooter）を探して切り取る
        const footerElement = tempDiv.querySelector('#sharedFooter');
        if (footerElement) {
          footerElement.parentNode.removeChild(footerElement);
          // フッターを本来の配置場所（最下部）に挿入する
          const footerContainer = document.getElementById('footer-container');
          if (footerContainer) {
            footerContainer.appendChild(footerElement);
          }
        }

        // 残りの部分（ヘッダーとメニュー）を上部のコンテナに挿入する
        document.getElementById('common-header-container').innerHTML = tempDiv.innerHTML;
        
        initMenu();
      } catch (error) {
        console.warn('共通メニューの読み込みに失敗しました。');
      }
    }

    function initMenu() {
      const hamburger = document.getElementById('hamburger');
      const globalNav = document.getElementById('globalNav');
      
      if (!hamburger || !globalNav) return;

      function toggleMenu() {
        hamburger.classList.toggle('active');
        globalNav.classList.toggle('active');
        document.body.classList.toggle('no-scroll');
      }

      hamburger.addEventListener('click', toggleMenu);

      const navLinks = document.querySelectorAll('.nav-list a');
      navLinks.forEach(link => {
        link.addEventListener('click', () => {
          if(globalNav.classList.contains('active')) {
            toggleMenu();
          }
        });
      });
    }

    function initCrayonCountdown() {
    const targetDate = new Date(2026, 10, 17, 0, 0, 0).getTime();
    const daysEl = document.getElementById('crayonDays');
    const wrapperEl = document.getElementById('crayonCountdown');

    if (!daysEl || !wrapperEl) return;

    function update() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        wrapperEl.style.display = 'none';
        return;
      }
      const days = Math.ceil(distance / (1000 * 60 * 60 * 24));
      daysEl.textContent = days;
    }
    
    update();
    setInterval(update, 1000 * 60 * 60); 
  }

  // ==================================================
  // ゲームロジック：倍率の二段階進化 ＆ プレビュー対応
  // ==================================================
  function initGame() {
    const oshiBtn = document.getElementById('oshiBtn');
    const canvas = document.getElementById('oshiCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    const totalCounter = document.getElementById('totalCounter');
    const comboCounter = document.getElementById('comboCounter');
    const venueText = document.getElementById('venueText'); 
    const gameArea = document.getElementById('gameArea');
    const heroSection = document.getElementById('hero');

    if (!oshiBtn) return;

    // --- 画像のプリロードとCanvas描画ロジック ---
    const oshiImages = {};
    for (let i = 1; i <= 18; i++) {
      const numStr = String(i).padStart(2, '0');
      const key = `am_${numStr}`;
      const img = new Image();
      img.src = `game/${key}.png`; /* 最背面背景 */
      oshiImages[key] = img;
    }

    if (canvas) {
      canvas.width = 800;
      canvas.height = 800;
    }

    // Canvasへの描画関数 (プレビュー時の画像未発見フォールバック対応)
    function drawOshiCanvas(imageKey, comboCount) {
      if (!ctx) return;
      const img = oshiImages[imageKey];
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // ★ スケール（倍率）と位置（Y軸降下）の計算
      const minScaleVal = 1.5;        
      const midScaleVal = 4.0;
      const maxScaleVal = 10.0; // 100コンボで最大10倍化
      
      let currentDrawScale = minScaleVal;
      let shiftY = 0;

      if (comboCount <= 30) {
        currentDrawScale = minScaleVal + ((midScaleVal - minScaleVal) * (comboCount / 30));
        shiftY = 120 * (comboCount / 30); // 30コンボまでは動かさない（今の動き）
      } else if (comboCount <= 100) {
        currentDrawScale = midScaleVal + ((maxScaleVal - midScaleVal) * ((comboCount - 30) / 70));
        shiftY = 120 + (230 * ((comboCount - 30) / 70));
      } else {
        currentDrawScale = maxScaleVal;
        shiftY = 350;
      }

      // ▼画像がないプレビュー環境用の代役を描画▼
      if (!img || !img.complete || img.naturalWidth === 0) {
        ctx.fillStyle = 'rgba(255, 42, 122, 0.7)'; 
        ctx.beginPath();
        // 常に一定のサイズで描画 (拡大はCSS側で行うため)
        const radius = w * 0.35;
        ctx.arc(w/2, h/2, radius, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NO IMAGE', w/2, h/2);
        
        // カラーセロハン効果
        if (comboCount > 0) {
           let colorRatio = Math.min(comboCount / 30, 1.0);
           let opacity = 0.20; 
           const greenValue = Math.floor(255 * (1 - colorRatio));
           ctx.globalCompositeOperation = 'source-atop';
           ctx.fillStyle = `rgba(255, ${greenValue}, 0, ${opacity})`;
           ctx.fillRect(0, 0, w, h);
           ctx.globalCompositeOperation = 'source-over';
        }
        return;
      }
      
      // ▼通常環境での画像描画▼
      // 画像自体は常にキャンバス領域(800x800)に収まるように描画する
      const baseScale = Math.min(w / img.width, h / img.height);
      const drawW = img.width * baseScale;
      const drawH = img.height * baseScale;
      const drawX = (w - drawW) / 2;
      const drawY = (h - drawH) / 2;

      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(img, drawX, drawY, drawW, drawH);

      // カラーセロハン効果 (染まり具合20%上限)
      if (comboCount > 0) {
        let colorRatio = Math.min(comboCount / 30, 1.0); 
        let opacity = (comboCount <= 30) ? 0.20 * colorRatio : 0.20; 
        const greenValue = Math.floor(255 * (1 - colorRatio));
        
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = `rgba(255, ${greenValue}, 0, ${opacity})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // 初期画像の表示
    oshiImages['am_01'].onload = () => {
      drawOshiCanvas('am_01', 0);
    };
    setTimeout(() => drawOshiCanvas('am_01', 0), 200);

    // --- Firebase 接続ロジック ---
    let totalAudienceRef = null;
    let serverTotalAudience = 0; 
    let pendingAudience = 0;     

    if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== "ここに本物のAPIキーを書いてください") {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        totalAudienceRef = database.ref('total_audience');

        totalAudienceRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data !== null) {
            serverTotalAudience = parseInt(data, 10);
            updateAudienceDisplay();
          }
        });
      } catch (e) {
        console.error("Firebase初期化エラー:", e);
      }
    } else {
      serverTotalAudience = 0;
      setTimeout(() => { updateAudienceDisplay(); }, 100);
    }

    setInterval(() => {
      if (pendingAudience > 0 && totalAudienceRef) {
        const sendCount = pendingAudience;
        totalAudienceRef.set(firebase.database.ServerValue.increment(sendCount))
          .then(() => {
            pendingAudience -= sendCount;
            updateAudienceDisplay();
          })
          .catch((error) => console.error("Firebase送信エラー:", error));
      }
    }, 5000); 

    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

    let combo = 0;
    let lastClickTime = 0;
    let tapHistory = [];
    const MAX_TAPS_PER_SECOND = 8; 

    const minScale = 1.5;        
    const midScale = 4.0;
    const maxScale = 10.0; // 100コンボで最大10倍        
    let currentScale = minScale; 

    const minFontSize = 3.5;     
    const maxFontSize = 8.0;     

    const phrases_1_30 = ["ありがとう！", "うれしい！", "ニヤリ！", "いいねありがとう！", "周年ライブきて！", "ハートありがと！"];
    const phrases_10_30 = ["ハイスピ10周年ライブ", "11/17！渋谷！", "WWWXであります！", "絶対に来てください！", "今すぐメモ！"];
    const phrases_31_plus = ["11/17！11/17！", "2026年11月17日！", "聖奈あむのリアバ1か月前！", "渋谷WWWX", "周年！WWWX", "ハイスピ10周年ライブ", "もちろん来るよね？"];
    const phrases_50_plus = ["いちいちいちなな！", "今すぐ予定をあけろ！", "周年もリアバも予定あける！", "来なかったら××！", "絶対来るよなオマエら！？", "わかった？わわかってるよな？"];

    function getVenue(clicks) {
      if (clicks < 50) return "目標：路上ライブ（50人）";
      if (clicks < 300) return "目標：渋谷 VIDENT（300人）";
      if (clicks < 600) return "目標：渋谷 WWW X（600人）";
      if (clicks < 700) return "目標：渋谷 duo（700人）";
      if (clicks < 1500) return "目標：Zepp Shinjuku（1,500人）";
      if (clicks < 2500) return "目標：Zepp DiverCity（2,500人）";
      if (clicks < 5000) return "目標：東京国際フォーラム（5,000人）";
      if (clicks < 8000) return "目標：東京ガーデンシアター（8,000人）";
      if (clicks < 14000) return "目標：日本武道館（1.4万人）";
      if (clicks < 30000) return "目標：さいたまスーパーアリーナ（3万人）";
      if (clicks < 55000) return "目標：東京ドーム（5.5万人）";
      if (clicks < 80000) return "目標：国立競技場（8万人）";
      if (clicks < 200000) return "目標：渋谷エリア（20万人）";
      if (clicks < 300000) return "目標：6大ドームツアー（30万人）";
      if (clicks < 1000000) return "目標：東京ドーム20回公演（100万人）";
      if (clicks < 3000000) return "目標：6大ドームツアー10周（300万人）";
      if (clicks < 10000000) return "目標：東京23区エリア（1,000万人）";
      if (clicks < 120000000) return "目標：47都道府県ツアー（1.2億人）";
      if (clicks < 8300000000) return "目標：地球（83億人）";
      return "👑 地球到達!!（83億人） 👑";
    }

    function getPhrases(currentCombo) {
      let currentPhrases = [];
      if (currentCombo <= 30) {
        currentPhrases = currentPhrases.concat(phrases_1_30);
        if (currentCombo >= 10) currentPhrases = currentPhrases.concat(phrases_10_30);
      } else {
        currentPhrases = currentPhrases.concat(phrases_31_plus);
        if (currentCombo >= 50) currentPhrases = currentPhrases.concat(phrases_50_plus);
      }
      return currentPhrases;
    }

    function getRandomOshiImage(currentCombo) {
      if (currentCombo === 0) return 'am_01.png';
      let min, max;
      if (currentCombo <= 30) {
        min = 1; max = 9;
      } else {
        min = 10; max = 18;
      }
      const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
      const paddedNum = String(randomNum).padStart(2, '0');
      return `am_${paddedNum}.png`;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playVoice(level) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const baseFreq = level === 1 ? 400 : level === 2 ? 600 : 800;
      osc.frequency.value = baseFreq + Math.random() * 300; 
      osc.type = level === 3 ? 'square' : 'triangle';
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function updateAudienceDisplay() {
      const currentVisualTotal = serverTotalAudience + pendingAudience;
      totalCounter.textContent = `動員: ${currentVisualTotal.toLocaleString()}`;
      venueText.textContent = getVenue(currentVisualTotal);
    }

    let currentLevel = 1;
    let tapGuideTimer = null; 

    oshiBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const now = Date.now();

      if (now - lastClickTime < 50) return; 

      tapHistory = tapHistory.filter(t => now - t < 1000);
      if (tapHistory.length >= MAX_TAPS_PER_SECOND) return;

      tapHistory.push(now);

      oshiBtn.classList.remove('resetting');
      venueText.classList.add('hidden');
      
      clearTimeout(tapGuideTimer);
      const tapGuide = document.getElementById('tapGuide');
      if (tapGuide) {
        tapGuide.style.animation = 'none';
        tapGuide.style.opacity = '0';
      }

      if (now - lastClickTime < 1000) combo++; else combo = 1; 
      lastClickTime = now;

      pendingAudience++;
      if (!totalAudienceRef) {
        serverTotalAudience++;
        pendingAudience = 0;
      }
      updateAudienceDisplay();

      // Canvasへ描画
      const newImageSrc = getRandomOshiImage(combo);
      const match = newImageSrc.match(/am_(\d+)\.png/);
      const imageKey = match ? `am_${match[1]}` : 'am_01';
      drawOshiCanvas(imageKey, combo);

      let colorRatio = 0;
      let shiftY = 0;

      if (combo <= 30) {
        currentScale = minScale + ((midScale - minScale) * (combo / 30));
        colorRatio = combo / 30; 
        shiftY = 120 * colorRatio; 
      } else if (combo <= 100) {
        currentScale = midScale + ((maxScale - midScale) * ((combo - 30) / 70));
        colorRatio = 1.0; 
        shiftY = 120 + (230 * ((combo - 30) / 70));
      } else {
        currentScale = maxScale;
        colorRatio = 1.0;
        shiftY = 350;
      }

      const greenValue = Math.floor(255 * (1 - colorRatio)); 
      oshiBtn.style.setProperty('--aura-color', `rgb(255, ${greenValue}, 0)`);
      
      let blurValue = (combo > 0) ? 10 + (20 * colorRatio) : 0;
      oshiBtn.style.setProperty('--shadow-blur', `${blurValue}px`);

      oshiBtn.style.transform = `translateZ(0) translateY(${shiftY}px) scale(${currentScale - 0.15})`;
      
      setTimeout(() => {
        oshiBtn.style.transform = `translateZ(0) translateY(${shiftY}px) scale(${currentScale})`;
      }, 50);

      if (combo > 30) {
        currentLevel = 3; heroSection.className = 'hero level-3';
      } else if (combo > 10) {
        currentLevel = 2; heroSection.className = 'hero level-2';
      } else {
        currentLevel = 1; heroSection.className = 'hero';
      }

      comboCounter.textContent = combo > 1 ? `${combo} COMBO!!` : '';

      playVoice(currentLevel);
      createFloatingText(currentLevel, combo);
    });

    function createFloatingText(level, currentCombo) {
      const existingTexts = document.querySelectorAll('.floating-text');
      if (existingTexts.length > 35) existingTexts[0].remove();

      const textEl = document.createElement('div');
      textEl.className = 'floating-text';
      
      const currentPhrases = getPhrases(currentCombo);
      textEl.textContent = currentPhrases[Math.floor(Math.random() * currentPhrases.length)];

      let fontSize = (currentCombo <= 30) 
        ? minFontSize + ((maxFontSize - minFontSize) * (currentCombo / 30))
        : maxFontSize;
      textEl.style.fontSize = `${fontSize}cqw`;

      const randomOffsetX = (Math.random() - 0.5) * 60; 
      textEl.style.left = `calc(50% + ${randomOffsetX}cqw)`;
      
      let angle, randomOffsetY, travelY;
      if (currentCombo > 30) {
        angle = (Math.random() - 0.5) * 50; 
        randomOffsetY = (Math.random() - 0.5) * 60; 
        textEl.style.top = `calc(45% + ${randomOffsetY}cqw)`; 
        travelY = 15 + Math.random() * 25; 
      } else {
        angle = (Math.random() - 0.5) * 20; 
        randomOffsetY = (Math.random() - 0.5) * 40; 
        textEl.style.top = `calc(25% + ${randomOffsetY}cqw)`; 
        travelY = 25; 
      }

      textEl.style.setProperty('--angle', `${angle}deg`);
      textEl.style.setProperty('--travel-y', `${travelY}cqw`);

      gameArea.appendChild(textEl);
      setTimeout(() => { if (textEl.parentNode) textEl.remove(); }, 1000);
    }

    setInterval(() => {
      if (combo > 0 && Date.now() - lastClickTime >= 1000) {
        combo = 0;
        currentLevel = 1;
        currentScale = minScale; 
        
        comboCounter.textContent = '';
        heroSection.className = 'hero'; 
        
        venueText.classList.remove('hidden');

        drawOshiCanvas('am_01', 0);

        oshiBtn.classList.add('resetting');
        oshiBtn.style.transform = `translateZ(0) translateY(0px) scale(${minScale})`; 
        oshiBtn.style.setProperty('--shadow-blur', '0px');

        tapGuideTimer = setTimeout(() => {
          const tapGuide = document.getElementById('tapGuide');
          if (tapGuide) {
            tapGuide.style.animation = 'pulse-tap 1.2s infinite';
            tapGuide.style.opacity = '1';
          }
        }, 2500);
      }
    }, 100);
  }

  // ==================================================
  // ==================================================
  
  window.addEventListener('load', () => { loadCommonHeader(); initCrayonCountdown(); initGame(); });
</script>
