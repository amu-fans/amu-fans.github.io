<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【非公式】勝手にあむちゃん応援ファンサイト</title>

<script src="countdown/list.js"></script>

<style>

:root{--main-pink:#ff2a7a;--text-black:#111111;--bg-white:#ffffff;--pk:#ff2a7a;--pk2:#ff9cc2;--k:#0c070c;--k2:#170d17;--k3:#261526;--wh:#fff6fa;--mu:#bba6b4;--ln:#4a2540;--lv:#c9a7ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;-webkit-font-smoothing:antialiased}
.no-scroll{overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;z-index:1100;background:var(--k);border-bottom:3px solid var(--pk)}
.header:after{content:"";position:absolute;left:0;right:0;top:100%;height:9px;pointer-events:none;background:linear-gradient(135deg,var(--pk) 25%,transparent 25%) -9px 0,linear-gradient(225deg,var(--pk) 25%,transparent 25%) -9px 0;background-size:18px 9px}
.site-logo{position:relative;padding-left:14px;font-size:13px;font-weight:900;letter-spacing:.06em;color:#fff;text-decoration:none;line-height:1.35;max-width:calc(100% - 60px);z-index:1001}
.site-logo:before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:5px;background:var(--pk);transform:skewX(-14deg)}
.hamburger{width:30px;height:20px;position:relative;cursor:pointer;z-index:1001}
.hamburger span{position:absolute;left:0;width:100%;height:3px;background:#fff;transition:all .3s ease}
.hamburger span:nth-child(1){top:0}.hamburger span:nth-child(2){top:50%;transform:translateY(-50%);width:70%;background:var(--pk)}.hamburger span:nth-child(3){bottom:0}
.hamburger.active span:nth-child(1){top:50%;transform:translateY(-50%) rotate(45deg)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){bottom:50%;transform:translateY(50%) rotate(-45deg)}
.global-nav{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;background:var(--k);z-index:1000;display:flex;flex-direction:column;align-items:center;padding-top:110px;overflow:hidden;transform:translateX(100%);transition:transform .45s cubic-bezier(.77,0,.18,1)}
.global-nav:before{content:"";position:absolute;right:-25%;top:0;width:75%;height:100%;background:var(--pk);opacity:.14;transform:skewX(-14deg)}
.global-nav.active{transform:translateX(0)}
.nav-list{list-style:none;text-align:center;position:relative}
.nav-list li{margin:20px 0;opacity:0;transform:translateY(20px);transition:opacity .3s,transform .3s}
.global-nav.active .nav-list li{opacity:1;transform:none}
.global-nav.active .nav-list li:nth-child(1){transition-delay:.25s}.global-nav.active .nav-list li:nth-child(2){transition-delay:.33s}.global-nav.active .nav-list li:nth-child(3){transition-delay:.41s}.global-nav.active .nav-list li:nth-child(4){transition-delay:.49s}
.nav-list a{display:block;color:#fff;text-decoration:none;font-size:34px;font-weight:900;letter-spacing:2px;transform:skewX(-8deg)}
.nav-list a:hover{color:var(--pk)}
.nav-list span{display:block;font-size:12px;font-weight:700;letter-spacing:.2em;margin-top:2px;color:var(--pk)}
.nav-note{position:absolute;bottom:0;left:0;width:100%;padding:20px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;font-size:11px;line-height:1.7;color:var(--mu)}
.site-footer{position:relative;width:100%;background:var(--k);color:var(--mu);text-align:center;font-size:11px;line-height:1.8;padding:44px 20px calc(36px + env(safe-area-inset-bottom));border-top:3px solid var(--pk)}
.site-footer p+p{margin-top:8px}.site-footer .copy{font-size:10px;margin-top:14px;color:var(--pk2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,2,8,.8);z-index:2000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-content{position:relative;width:100%;max-width:400px;padding:28px 22px;background:var(--k2);color:var(--wh);border:2px solid var(--pk);box-shadow:8px 8px 0 var(--pk);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.modal-close-btn{position:absolute;top:8px;right:22px;font-size:28px;color:var(--pk);background:none;border:none;cursor:pointer}
.modal-title{font-size:19px;font-weight:900;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--pk);text-align:center;color:#fff}
.modal-info-group{margin-bottom:12px}
.modal-label{display:block;font-size:11px;font-weight:900;color:var(--pk);margin-bottom:2px;letter-spacing:.08em}
.modal-text{font-size:14px;font-weight:700;color:var(--wh);line-height:1.5}
.modal-text a{color:var(--pk2);text-decoration:underline;word-break:break-all}
.header.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.6)}
@media(min-width:900px){
.header{height:72px;padding:0 max(28px,calc((100% - 1120px)/2))}
.site-logo{font-size:15px;max-width:none}
.hamburger,.nav-note,.global-nav:before{display:none}
.global-nav{left:auto;right:max(28px,calc((100% - 1120px)/2));width:auto;height:72px;padding:0;flex-direction:row;align-items:center;background:none;overflow:visible;transform:none;transition:none;z-index:1101}
.nav-list{display:flex;gap:34px}
.nav-list li{margin:0;opacity:1;transform:none}
.nav-list a{font-size:15px;letter-spacing:.14em;transform:skewX(-8deg)}
.nav-list span{font-size:10px;letter-spacing:.12em;margin-top:0}
.nav-list a:hover span{color:#fff}
}

body{background:var(--k);color:var(--wh);overflow-x:hidden}
main{display:block}
#loading{position:fixed;inset:0;background:var(--k);display:flex;justify-content:center;align-items:center;z-index:9999;overflow:hidden;transition:transform .8s cubic-bezier(.8,0,.2,1)}
#loading:before{content:"";position:absolute;inset:-10%;background:linear-gradient(115deg,transparent 38%,var(--pk) 38% 64%,transparent 64%)}
#loading.loaded{transform:translateY(-100%)}
.loading-logo{position:relative;color:#fff;font-size:clamp(44px,12vw,78px);font-weight:900;text-align:center;line-height:1.15;letter-spacing:.08em;text-shadow:4px 4px 0 var(--k);animation:pulse 1.5s infinite}
.loading-logo-en{display:block;font-size:clamp(14px,3.6vw,22px);letter-spacing:.4em;margin-top:6px}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.hero{--hh:64px;position:relative;padding-top:var(--hh)}
@media(min-width:900px){.hero{--hh:72px}}
.hero-box{position:relative;max-width:1280px;margin:0 auto}
.cd-stack{position:relative;overflow:hidden;width:100%;height:calc(100vh - var(--hh));height:calc(100svh - var(--hh));background:var(--k)}
@media(min-width:900px){.cd-stack{height:auto;aspect-ratio:16/9}}
.cd-slot{position:absolute;display:block;overflow:hidden;background:var(--k3);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.cd-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity .8s ease}
.cd-slot img.in{opacity:0}
.cd-slot:not([href]){cursor:default}
.hero-over{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(12,7,12,.72),rgba(12,7,12,.2) 68%,transparent)}
.hero-line{display:inline-block;background:var(--k);color:#fff;font-weight:900;font-size:clamp(15px,4vw,30px);letter-spacing:.12em;padding:8px 28px 8px 22px;transform:skewX(-12deg);box-shadow:5px 5px 0 var(--pk)}
.hero-line span{display:inline-block;transform:skewX(12deg)}
.countdown-wrapper{display:inline-block;margin-top:16px;padding:2px 44px 2px 36px;background:var(--pk);transform:skewX(-12deg);box-shadow:7px 7px 0 var(--k)}
.countdown-text{display:flex;align-items:baseline;gap:8px;color:#fff;font-weight:900;transform:skewX(12deg)}
.countdown-prefix,.countdown-suffix{font-size:clamp(20px,5vw,40px)}
.countdown-number{font-size:clamp(84px,22vw,200px);line-height:1.05;padding:0 4px}
.section-wrapper{padding:72px max(20px,calc((100% - 1040px)/2)) 56px;background:var(--k2);clip-path:polygon(0 26px,100% 0,100% 100%,0 100%);margin-top:-26px}
#sns{background:var(--k)}
.section-title{display:inline-block;padding:0 26px 0 18px;font-size:clamp(34px,7vw,52px);font-weight:900;line-height:1.3;letter-spacing:.06em;color:#fff;background:var(--pk);transform:skewX(-12deg);box-shadow:6px 6px 0 var(--k3);margin-bottom:8px}
.section-subtitle{display:block;font-size:12px;font-weight:900;letter-spacing:.2em;color:var(--pk2);margin:10px 0 24px}
.calendar-header{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:16px;position:relative}
.calendar-year-month{font-size:30px;font-weight:900;letter-spacing:.08em;color:#fff}
.calendar-nav-btn{background:none;border:none;font-size:26px;color:var(--pk);cursor:pointer;font-weight:900;padding:4px 14px}
.calendar-nav-btn:hover{color:#fff}
.calendar-today-btn{position:absolute;right:0;background:none;color:#fff;border:2px solid var(--pk);padding:4px 12px;font-size:11px;font-weight:900;cursor:pointer;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.calendar-today-btn:hover{background:var(--pk)}
.calendar-container{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;text-align:center}
.calendar-container th{padding:9px 0;font-size:12px;font-weight:900;color:#fff;background:var(--pk);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.calendar-container td{height:88px;vertical-align:top;padding:3px;font-size:12px;font-weight:700;color:var(--wh);background:var(--k3);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.calendar-container td:empty{background:transparent}
.calendar-container td:nth-child(6){background:#22203a}
.calendar-container td:nth-child(7),.calendar-container td.is-holiday{background:#36182a}
.date-num{text-align:left;padding-left:2px;margin-bottom:2px;color:var(--wh)}
.calendar-container td:nth-child(6) .date-num{color:#9db8ff}
.calendar-container td:nth-child(7) .date-num,.calendar-container td.is-holiday .date-num{color:var(--pk2)}
.event-item{display:block;font-size:8px;padding:2px 3px;margin-bottom:2px;text-align:left;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:900;text-decoration:none}
.event-item:active{transform:scale(.95)}
.event-item.cat-anniv{background:var(--pk);color:#fff}
.event-item.cat-live{background:#fff;color:#111}
.event-item.cat-tiktok{background:var(--lv);color:#111}
.list-schedule-link{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:14px;color:#fff;text-decoration:none;font-size:13px;font-weight:900}
.list-schedule-link svg{width:20px;height:20px;fill:var(--pk)}
.list-schedule-link:hover{color:var(--pk2)}
.sns-group{margin-bottom:30px}
.sns-group-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:14px;padding-left:12px;border-left:5px solid var(--pk);line-height:1.1}
.social-icons-wrapper{display:flex;flex-wrap:wrap;gap:18px}
.social-icon{width:52px;height:52px;display:flex;justify-content:center;align-items:center;color:#fff;border:2px solid var(--pk);border-radius:50%;text-decoration:none;transition:background .2s,transform .2s}
.social-icon:hover{background:var(--pk);transform:translateY(-3px)}
.social-icon svg{width:24px;height:24px;fill:currentColor}
@media(min-width:900px){.calendar-container td{height:118px;padding:5px;font-size:13px}.event-item{font-size:11px;padding:3px 5px}.calendar-container th{font-size:14px}}
@media(prefers-reduced-motion:reduce){#loading{transition:none}.loading-logo{animation:none}}

</style>
</head>

<script>
  // ==================================================
  // 動的カレンダー ＆ CSV自動連動システム
  // ==================================================
  let currentDate = new Date(2026, 4, 1); 
  let scheduleEvents = [];
  let isFirstRender = true; 

  function addDynamicEvents() {
    const currentYear = new Date().getFullYear();
    for (let y = 2026; y <= 2030; y++) {
      const bdayStr = `${y}/12/17`;
      if (!scheduleEvents.some(ev => ev.date === bdayStr && ev.title.includes('誕生日'))) {
        scheduleEvents.push({
          date: bdayStr,
          important: '', 
          title: "誕生日",
          venue: "ONLINE",
          openStart: "---",
          live: "---",
          tokuten: "---",
          nyujoTokuten: "---",
          link: ""
        });
      }

      for (let m = 1; m <= 12; m++) {
        if (y === 2026 && m < 5) continue;
        let d = new Date(y, m - 1, 1);
        while (d.getMonth() === m - 1) {
          const isSaturday = d.getDay() === 6;
          const startDate = new Date(2026, 5, 6); 
          const endDate = new Date(2026, 10, 17); 
          const isMondayBeforeTarget = d.getDay() === 1 && d >= startDate && d <= endDate;

          if (isSaturday || isMondayBeforeTarget) { 
            let mm = String(m).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            let dateStr = `${y}/${mm}/${dd}`;
            
            let liveText = "土曜定期配信。時間はSNSで告知";
            if (d >= startDate && d <= endDate) {
              liveText = "月曜土曜定期配信。時間はSNSで告知";
            }
            
            if (!scheduleEvents.some(ev => ev.date === dateStr && ev.title.includes('TikTok'))) {
              scheduleEvents.push({
                date: dateStr,
                important: '', 
                title: "TikTok個人配信",
                venue: "ONLINE", 
                openStart: "---",
                live: liveText,
                tokuten: "---",
                nyujoTokuten: "---",
                link: "https://www.tiktok.com/@amunyan__"
              });
            }
          }
          d.setDate(d.getDate() + 1);
        }
      }
    }
  }

  async function loadScheduleFromCSV() {
    try {
      const response = await fetch('schedule.csv');
      if (!response.ok) throw new Error('CSVロード失敗');
      
      const arrayBuffer = await response.arrayBuffer();
      let csvText = '';
      
      try {
        const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
        csvText = utf8Decoder.decode(arrayBuffer);
      } catch (e) {
        const sjisDecoder = new TextDecoder('shift_jis');
        csvText = sjisDecoder.decode(arrayBuffer);
      }
      
      scheduleEvents = parseCSV(csvText);
    } catch (error) {
      console.warn('スケジュールデータの読み込みに失敗しました。モックデータで継続します。');
      scheduleEvents = [];
    }
    
    addDynamicEvents();
    renderCalendar();
  }

  // ★ 修正：12列分（重要フラグ対応）を確保しつつ列を正しく割り当てる（装飾等は一切なし）
  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
    if (lines.length <= 1) return [];
    
    return lines.slice(1).map(line => {
      const cols = line.split(',').map(c => c.trim());
      // 新しいCSVフォーマットに合わせて12列分を確保
      while (cols.length < 12) cols.push('');

      // 列を1つずつずらして正しく割り当て
      const d = cols[0], imp = cols[1], t = cols[2], v = cols[3];
      const o = cols[4], s = cols[5];
      const ls = cols[6], le = cols[7];
      const ts = cols[8], te = cols[9];
      const nyu = cols[10], link = cols[11];

      let openStart = '---';
      if (o && s) openStart = `${o} / ${s}`;
      else if (o) openStart = `${o} / 未定`;
      else if (s) openStart = `未定 / ${s}`;

      let live = '---';
      if (ls && le) live = `${ls}～${le}`;
      else if (ls) live = (ls === '終日' || ls === '未定') ? ls : `${ls}～`;
      else if (le) live = `～${le}`;

      let tokuten = '---';
      if (ts && te) tokuten = `${ts}～${te}`;
      else if (ts) tokuten = (ts === '終日' || ts === '未定') ? ts : `${ts}～`;
      else if (te) tokuten = `～${te}`;

      return { 
        date: d, 
        important: imp,
        title: t, 
        venue: v, 
        openStart: openStart, 
        live: live, 
        tokuten: tokuten, 
        nyujoTokuten: nyu, 
        link: link 
      };
    }).filter(item => item.date !== '');
  }

  function renderCalendar() {
    if (isFirstRender && scheduleEvents.length > 0) {
      isFirstRender = false;
      const today = new Date();
      today.setHours(0, 0, 0, 0); 
      
      const upcomingEvent = scheduleEvents.find(ev => new Date(ev.date) >= today);
      
      if (upcomingEvent) {
        const upcomingDate = new Date(upcomingEvent.date);
        currentDate = new Date(upcomingDate.getFullYear(), upcomingDate.getMonth(), 1);
      } else {
        currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
      }

      if (currentDate.getFullYear() < 2026 || (currentDate.getFullYear() === 2026 && currentDate.getMonth() < 4)) {
        currentDate = new Date(2026, 4, 1);
      }
    }

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('calendarYearMonth').textContent = `${year}.${String(month + 1).padStart(2, '0')}`;

    const prevBtn = document.querySelector('.calendar-nav-btn[onclick="prevMonth()"]');
    if (year <= 2026 && month <= 4) {
      prevBtn.style.visibility = 'hidden';
    } else {
      prevBtn.style.visibility = 'visible';
    }

    const firstDayIndex = new Date(year, month, 1).getDay(); 
    const totalDays = new Date(year, month + 1, 0).getDate(); 

    const calendarBody = document.getElementById('calendarBody');
    calendarBody.innerHTML = '';

    let dateCounter = 1;
    let html = '';

    let adjustedFirstDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

    for (let i = 0; i < 6; i++) {
      let rowHtml = '<tr>';
      let addedAnyDay = false;

      for (let j = 0; j < 7; j++) {
        const gridIndex = i * 7 + j;
        if (gridIndex < adjustedFirstDay || dateCounter > totalDays) {
          rowHtml += '<td></td>';
        } else {
          const currentDayStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(dateCounter).padStart(2, '0')}`;
          
          const dayEvents = scheduleEvents.filter(ev => {
            const evDate = new Date(ev.date);
            return evDate.getFullYear() === year && evDate.getMonth() === month && evDate.getDate() === dateCounter;
          });

          let eventsHtml = '';
          dayEvents.forEach(ev => {
            let catClass = 'cat-live'; 
            if (ev.title.includes('記念') || ev.title.includes('誕生日')) catClass = 'cat-anniv'; 
            if (ev.title.includes('TikTok') || ev.title.includes('配信')) catClass = 'cat-tiktok'; 

            let label = '';
            if (ev.title.includes('TikTok')) {
              label = 'TikTok個人配信';
            } else {
              if (ev.live && ev.live !== '終日' && ev.live !== '---') {
                label += `${ev.live.split('～')[0]} `;
              }
              
              let venueText = ev.venue;
              if (venueText === 'ONLINE' || !venueText || venueText.trim() === '' || venueText === '---' || venueText === '-') {
                venueText = ev.title;
              }
              label += venueText;
            }

            eventsHtml += `<a class="event-item ${catClass}" onclick="openEventDetails(event, '${encodeURIComponent(JSON.stringify(ev))}')">${label}</a>`;
          });

          rowHtml += `<td>
            <div class="date-num">${dateCounter}</div>
            ${eventsHtml}
          </td>`;
          dateCounter++;
          addedAnyDay = true;
        }
      }
      rowHtml += '</tr>';
      if (addedAnyDay) {
        html += rowHtml;
      }
    }
    calendarBody.innerHTML = html;
  }

  function prevMonth() {
    if (currentDate.getFullYear() < 2026 || (currentDate.getFullYear() === 2026 && currentDate.getMonth() <= 4)) return;
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  function goToToday() {
    currentDate = new Date();
    if (currentDate.getFullYear() < 2026 || (currentDate.getFullYear() === 2026 && currentDate.getMonth() < 4)) {
      currentDate = new Date(2026, 4, 1);
    }
    renderCalendar();
  }

  function openEventDetails(event, encodedData) {
    event.stopPropagation();
    const ev = JSON.parse(decodeURIComponent(encodedData));

    const isBirthday = ev.title === '誕生日';
    const isTikTok = ev.title.includes('TikTok');

    const groupVenue = document.getElementById('groupVenue');
    const groupOpenStart = document.getElementById('groupOpenStart');
    const groupLive = document.getElementById('groupLive');
    const groupTokuten = document.getElementById('groupTokuten');
    const groupBonus = document.getElementById('groupBonus');
    const groupTicket = document.getElementById('groupTicket');
    const ticketLabel = document.getElementById('ticketLabel');
    const titleEl = document.getElementById('modalTitle');

    groupVenue.style.display = 'block';
    groupOpenStart.style.display = 'block';
    groupLive.style.display = 'block';
    groupTokuten.style.display = 'block';
    groupBonus.style.display = 'block';
    groupTicket.style.display = 'block';
    ticketLabel.textContent = "チケットURL";

    if (isBirthday) {
      titleEl.innerHTML = `<span style="color: var(--main-pink); font-size: 16px; display: block; margin-bottom: 5px;">🎂 Happy Birthday 🎂<br>お誕生日おめでとう🎉</span>`;
      groupVenue.style.display = 'none';
      groupOpenStart.style.display = 'none';
      groupLive.style.display = 'none';
      groupTokuten.style.display = 'none';
      groupBonus.style.display = 'none';
      groupTicket.style.display = 'none';
    } else if (isTikTok) {
      titleEl.textContent = ev.title; 
      groupVenue.style.display = 'none';
      groupOpenStart.style.display = 'none';
      groupTokuten.style.display = 'none';
      groupBonus.style.display = 'none';
      
      document.getElementById('modalLive').textContent = ev.live || "木曜定期配信。時間はSNSで告知";
      
      ticketLabel.textContent = "配信URL";
      const ticketArea = document.getElementById('modalTicketArea');
      ticketArea.innerHTML = `<a href="https://www.tiktok.com/@amunyan__" target="_blank" style="color: var(--main-pink); text-decoration: underline; word-break: break-all;">https://www.tiktok.com/@amunyan__</a>`;
    } else {
      titleEl.textContent = ev.title;
      document.getElementById('modalVenue').textContent = ev.venue || '-';
      document.getElementById('modalOpenStart').textContent = ev.openStart || '-';
      document.getElementById('modalLive').textContent = ev.live || '-';
      document.getElementById('modalTokuten').textContent = ev.tokuten || '-';
      document.getElementById('modalBonus').textContent = ev.nyujoTokuten || '-';

      const ticketArea = document.getElementById('modalTicketArea');
      const hasLink = ev.link && ev.link.trim() !== '' && ev.link.trim() !== '#' && ev.link.trim() !== 'undefined';
      if (hasLink) {
        const cleanLink = ev.link.trim();
        ticketArea.innerHTML = `<a href="${cleanLink}" target="_blank" style="color: var(--main-pink); text-decoration: underline; word-break: break-all;">${cleanLink}</a>`;
        groupTicket.style.display = 'block'; 
      } else {
        groupTicket.style.display = 'none';
      }
    }

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(event) {
    if (event.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('active');

  async function loadCommonHeader() {
    try {
      const response = await fetch('header.html');
      if (!response.ok) throw new Error('Header load failed');
      const html = await response.text();
      
      const tempDiv = document.createElement('div');

      const footerElement = tempDiv.querySelector('#sharedFooter');

      initMenu();

      console.warn('共通メニューの読み込みに失敗しました。');
    }
  }

  function initMenu() {
    const hamburger = document.getElementById('hamburger');
    const globalNav = document.getElementById('globalNav');
    const siteLogo = document.getElementById('siteLogo');
    const navLinks = document.querySelectorAll('.nav-list a');

    if (!hamburger || !globalNav) return;

    function toggleMenu() {
      hamburger.classList.toggle('active');
      globalNav.classList.toggle('active');
      
      if (siteLogo) siteLogo.style.color = 'var(--bg-white)';

      document.body.classList.toggle('no-scroll');
    }

    hamburger.addEventListener('click', toggleMenu);

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        const targetId = link.getAttribute('href');
        
        if (targetId.startsWith('#') || targetId.includes('#')) {
          const hash = targetId.substring(targetId.indexOf('#'));
          const targetElement = document.querySelector(hash);
          
          if (targetElement) {
            e.preventDefault(); 
            if(globalNav.classList.contains('active')) {
              toggleMenu();
            }
            
            setTimeout(() => {
              const headerElement = document.getElementById('header');
              const headerHeight = headerElement ? headerElement.offsetHeight : 60;
              const targetPos = targetElement.getBoundingClientRect().top + window.scrollY - headerHeight;
              
              window.scrollTo({
                top: targetPos,
                behavior: 'smooth'
              });
            }, 400); 
          }
        } else {
          if(globalNav.classList.contains('active')) {
            toggleMenu();
          }
        }
      });
    });
  }

  function initCrayonCountdown() {
    const targetDate = new Date(2026, 10, 17, 0, 0, 0).getTime();
    const daysEl = document.getElementById('crayonDays');
    const wrapperEl = document.getElementById('crayonCountdown');

    if (!daysEl || !wrapperEl) return;

    function update() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        wrapperEl.style.display = 'none';
        return;
      }
      const days = Math.ceil(distance / (1000 * 60 * 60 * 24));
      daysEl.textContent = days;
    }
    
    update();
    setInterval(update, 1000 * 60 * 60); 
  }

  // ==================================================
  // カウントダウン画像の1枚絵：ランダムに敷き詰め → 左上から順に1枠ずつフェードで入れ替え
  //  ・PCは9列(16:9)、スマホは5列(画面1枚分)。画像の縦横比は自動判定
  //  ・入れ替えは「1枚絵が半分以上見えている間」だけ動作（タブ非表示・動きを減らす設定でも停止）
  //  ・画像は countdown/list.js に ["ファイル名","Xの投稿URL"] で登録（順番は不問）
  // ==================================================
  function renderCountdownStack() {
    const box = document.getElementById('cdStack');
    if (!box || typeof COUNTDOWN_IMAGES === 'undefined' || !COUNTDOWN_IMAGES.length) return;
    const items = COUNTDOWN_IMAGES.map(e => Array.isArray(e) ? { f: e[0], u: e[1] || '' } : { f: e, u: '' });
    const GAP = 4, INTERVAL = 1500, FADE = 800;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cache = new Map();
    const load = i => {
      if (!cache.has(i)) cache.set(i, new Promise(res => {
        const im = new Image();
        im.onload = () => res(im.naturalHeight / im.naturalWidth);
        im.onerror = () => res(0);
        im.src = 'countdown/' + items[i].f;
      }));
      return cache.get(i);
    };
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const mk = i => { const im = document.createElement('img'); im.alt = 'カウントダウンイラスト'; im.decoding = 'async'; im.src = 'countdown/' + items[i].f; return im; };
    const setLink = (a, i) => { if (items[i].u) { a.href = items[i].u; a.target = '_blank'; a.rel = 'noopener'; } else a.removeAttribute('href'); };
    let slots = [], queue = [], shown = new Map(), p = 0, token = 0, timer = null, busy = false, visible = true, lastW = 0;

    async function build() {
      const my = ++token; clearInterval(timer);
      box.innerHTML = ''; slots = []; shown = new Map(); busy = false;
      const W = box.clientWidth, H = box.clientHeight; lastW = W;
      const n = innerWidth >= 900 ? 9 : 5, cw = (W - GAP * (n - 1)) / n, colH = Array(n).fill(0);
      const order = shuffle(items.map((_, i) => i));
      order.slice(0, Math.ceil(n * H / cw) + n).forEach(load);
      let k = 0;
      while (Math.min(...colH) < H && k < order.length * 3) {
        const i = order[k++ % order.length];           // 枚数が足りない間だけ、先頭から再利用して全枠を埋める
        const r = await load(i); if (my !== token) return;
        if (!r) continue;
        const c = colH.indexOf(Math.min(...colH)), h = Math.round(cw * Math.min(Math.max(r, .45), 2));
        const a = document.createElement('a'); a.className = 'cd-slot';
        a.style.cssText = `left:${Math.round(c * (cw + GAP))}px;top:${colH[c]}px;width:${Math.round(cw)}px;height:${h}px`;
        a.appendChild(mk(i)); setLink(a, i); box.appendChild(a);
        slots.push({ a, i, port: r >= 1 }); shown.set(i, (shown.get(i) || 0) + 1); colH[c] += h + GAP;
      }
      queue = order.filter(i => !shown.has(i)); p = 0;
      if (!reduce) timer = setInterval(tick, INTERVAL);
    }

    async function swap() {
      if (!slots.length || !queue.length) return;
      const s = slots[p]; p = (p + 1) % slots.length;     // 左上の1番から順に、最後まで行ったら1番へ戻る
      let pick = -1;
      for (let q = 0; q < queue.length; q++) {            // 同じ向き(縦長/横長)の画像だけを入れる
        const r = await load(queue[q]);
        if (!r) { queue.splice(q--, 1); continue; }
        if ((r >= 1) === s.port) { pick = q; break; }
      }
      if (pick < 0) return;
      const i = queue.splice(pick, 1)[0], old = s.i, im = mk(i);
      im.className = 'in'; s.a.appendChild(im);
      requestAnimationFrame(() => requestAnimationFrame(() => im.classList.remove('in')));
      setTimeout(() => setLink(s.a, i), FADE / 2);
      setTimeout(() => s.a.querySelectorAll('img').forEach(x => { if (x !== im) x.remove(); }), FADE + 50);
      shown.set(old, shown.get(old) - 1);
      if (!shown.get(old)) { shown.delete(old); queue.push(old); }
      shown.set(i, (shown.get(i) || 0) + 1); s.i = i;
    }
    function tick() {                                      // 見えていない間は止める。進行中の1枠は最後まで終える
      if (busy || !visible || document.hidden) return;
      busy = true; swap().finally(() => { busy = false; });
    }

    new IntersectionObserver(es => { visible = es[0].intersectionRatio >= 0.5; }, { threshold: [0, .25, .5, .75, 1] }).observe(box);
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (Math.abs(box.clientWidth - lastW) > 1) build(); }, 250); });
    build();
  }

  
window.addEventListener('load', () => {
    loadCommonHeader(); 
    loadScheduleFromCSV();
    initCrayonCountdown(); 
    renderCountdownStack(); 

    const loading = document.getElementById('loading');
    const body = document.body;
    setTimeout(() => {
      loading.classList.add('loaded');
      body.classList.remove('no-scroll');

      if (window.location.hash) {
        setTimeout(() => {
          const targetElement = document.querySelector(window.location.hash);
          if (targetElement) {
            const headerElement = document.getElementById('header');
            const headerHeight = headerElement ? headerElement.offsetHeight : 60;
            const targetPos = targetElement.getBoundingClientRect().top + window.scrollY - headerHeight;
            window.scrollTo({
              top: targetPos,
              behavior: 'smooth'
            });
          }
        }, 100);
      }
    }, 1000);
  });

  window.addEventListener('scroll', () => {
    const header = document.getElementById('header');
    if (!header) return; 
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });
</script>
</body>
</html>
